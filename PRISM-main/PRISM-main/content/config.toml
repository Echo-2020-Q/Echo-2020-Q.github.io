[visitor_map]
enabled = true
title = "Visitor Map"
script_id = "mapmyvisitors"
script_url = "https://mapmyvisitors.com/map.js?cl=ffffff&w=a&t=tt&d=YQXHPuJxwIaoI_7mQOzC8d0Y51u-RekhkedFsjf7EPk"
